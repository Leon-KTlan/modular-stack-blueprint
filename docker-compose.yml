name: cangqiong
services:
  postgres:
    image: postgres:16-alpine
    container_name: cangqiong-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cangqiong
      POSTGRES_USER: cangqiong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cangqiong -d cangqiong"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cangqiong_postgres:/var/lib/postgresql/data
      - ./database/migrations/001_create_users.sql:/docker-entrypoint-initdb.d/001_create_users.sql:ro
      - ./database/migrations/002_create_miniapp_users.sql:/docker-entrypoint-initdb.d/002_create_miniapp_users.sql:ro
      - ./database/migrations/003_alter_audit_logs_resource_id_bigint.sql:/docker-entrypoint-initdb.d/003_alter_audit_logs_resource_id_bigint.sql:ro
      - ./database/migrations/004_create_circles.sql:/docker-entrypoint-initdb.d/004_create_circles.sql:ro
      - ./database/migrations/005_add_circles_deleted_at.sql:/docker-entrypoint-initdb.d/005_add_circles_deleted_at.sql:ro
      - ./database/seed/001_seed_users.sql:/docker-entrypoint-initdb.d/006_seed_users.sql:ro
      - ./database/seed/002_seed_circles.sql:/docker-entrypoint-initdb.d/007_seed_circles.sql:ro
      - ./database/seed/003_seed_circle_members.sql:/docker-entrypoint-initdb.d/008_seed_circle_members.sql:ro

volumes:
  cangqiong_postgres:
